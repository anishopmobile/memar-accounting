name: Vendor pinned Tabler locally (one-shot)
on:
  push:
    paths:
      - '.github/workflows/vendor-tabler.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download pinned package and save local runtime assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/vendor/tabler
          tmp="$(mktemp -d)"
          (
            cd "$tmp"
            npm pack @tabler/core@1.6.1 --ignore-scripts --silent > package-name.txt
            tar -xzf "$(cat package-name.txt)"
          )
          test -s "$tmp/package/dist/css/tabler.rtl.min.css"
          test -s "$tmp/package/dist/js/tabler.min.js"
          cp "$tmp/package/dist/css/tabler.rtl.min.css" assets/vendor/tabler/tabler.rtl.min.css
          cp "$tmp/package/dist/js/tabler.min.js" assets/vendor/tabler/tabler.min.js
          printf '%s\n' 'Tabler @tabler/core 1.6.1 (MIT) - https://github.com/tabler/tabler' 'Vendored compiled RTL CSS and JS; runtime uses project-local files only.' > assets/vendor/tabler/README.txt
          if test -f "$tmp/package/LICENSE"; then
            cp "$tmp/package/LICENSE" assets/vendor/tabler/LICENSE
          else
            curl -fsSL --retry 3 https://raw.githubusercontent.com/tabler/tabler/dev/LICENSE -o assets/vendor/tabler/LICENSE
          fi
          (cd assets/vendor/tabler && sha256sum tabler.rtl.min.css tabler.min.js > SHA256SUMS)
          grep -q 'Tabler' assets/vendor/tabler/tabler.rtl.min.css
      - name: Commit vendored source to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/vendor/tabler
          git diff --cached --quiet && exit 0
          git commit -m "chore(ui): vendor Tabler 1.6.1 RTL CSS and JS for offline runtime"
          git push origin HEAD:main
